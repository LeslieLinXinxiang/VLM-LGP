# Method registry for experiment runner
# command_template supports placeholders defined in manifest_schema.md

pure_llm:
  timeout_sec: 300
  command_template: >-
    python3 driver.py --mode pure_llm --scene {input_scene_g_path} --task-graph {input_task_graph_path} --seed {random_seed}

proposed:
  timeout_sec: 300
  command_template: >-
    python3 driver.py --mode proposed --scene {input_scene_g_path} --task-graph {input_task_graph_path} --seed {random_seed}

