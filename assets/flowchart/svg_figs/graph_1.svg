<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .edge { stroke: black; stroke-width: 2; }
      .node { fill: white; stroke: black; stroke-width: 5; }
      .lbl { font-family: serif; font-size: 14px; text-anchor: middle; alignment-baseline: central; font-weight: bold; }
      .edgelbl { font-family: serif; font-size: 12px; }
    </style>
  </defs>
  <!-- Edges -->
  <line x1="200" y1="450" x2="80" y2="320" class="edge"/>
  <line x1="200" y1="450" x2="200" y2="320" class="edge"/>
  <line x1="200" y1="450" x2="320" y2="320" class="edge"/>
  <line x1="80" y1="320" x2="140" y2="200" class="edge"/>
  <line x1="200" y1="320" x2="140" y2="200" class="edge"/>
  <line x1="200" y1="320" x2="260" y2="200" class="edge"/>
  <line x1="320" y1="320" x2="260" y2="200" class="edge"/>
  <line x1="140" y1="200" x2="200" y2="100" class="edge"/>
  <line x1="260" y1="200" x2="200" y2="100" class="edge"/>
  <line x1="200" y1="100" x2="200" y2="30" class="edge"/>
  
  <!-- Edge Labels -->
  <text x="140" y="400" class="edgelbl" transform="translate(-10,-10)">Right</text>
  <text x="190" y="385" class="edgelbl" transform="translate(-5,0)">Center</text>
  <text x="260" y="400" class="edgelbl" transform="translate(10,-10)">Left</text>

  <!-- Nodes -->
  <circle cx="200" cy="450" r="18" class="node"/><text x="200" y="450" class="lbl">0</text>
  <circle cx="80" cy="320" r="18" class="node"/><text x="80" y="320" class="lbl">3</text>
  <circle cx="200" cy="320" r="18" class="node"/><text x="200" y="320" class="lbl">2</text>
  <circle cx="320" cy="320" r="18" class="node"/><text x="320" y="320" class="lbl">1</text>
  <circle cx="140" cy="200" r="18" class="node"/><text x="140" y="200" class="lbl">5</text>
  <circle cx="260" cy="200" r="18" class="node"/><text x="260" y="200" class="lbl">4</text>
  <circle cx="200" cy="100" r="18" class="node"/><text x="200" y="100" class="lbl">6</text>
  <circle cx="200" cy="30" r="18" class="node"/><text x="200" y="30" class="lbl">7</text>
</svg>